name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Optional: only if the GOOGLE_SERVICES_JSON secret (base64) exists
      - name: Create google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" | base64 --decode > app/google-services.json
            echo "google-services.json created"
          else
            echo "No GOOGLE_SERVICES_JSON secret -> building without Firebase"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SecureCall-apk
          path: app/build/outputs/apk/debug/app-debug.apk
