plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// Apply Google Services only when google-services.json exists, so the build never fails without it.
// (Without the file the app still builds; instant-wake push is simply disabled.)
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('google-services.json not found -> building WITHOUT Firebase push wake-up')
}
android {
    namespace 'com.securecall.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.securecall.app"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "2.2"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'io.getstream:stream-webrtc-android:1.1.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.zxing:core:3.5.3'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
}
