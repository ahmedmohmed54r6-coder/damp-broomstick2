plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.securecall.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.securecall.app"
        minSdk 24
        targetSdk 34
        versionCode 15
        versionName "2.4"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'io.getstream:stream-webrtc-android:1.1.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // QR pairing (generate + scan, works without Google Play services)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // FCM "wake-up bell" (inactive unless app/google-services.json is present)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}

// Firebase is optional: the plugin is applied only when you add app/google-services.json (see SETUP_FCM.md)
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
